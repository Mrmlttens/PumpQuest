name: PumpQuest code tests
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PumpQuest
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check scene3d.js
          node --check app.js
      - name: Exercise, XP, and saved-workout tests
        run: node tests/smoke.js
      - name: Anatomy and 14-day cold spot tests
        run: node tests/anatomy.js
