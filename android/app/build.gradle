plugins { id 'com.android.application' }

android {
    namespace 'com.pumpquest.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.pumpquest.app'
        minSdk 26
        targetSdk 35
        versionCode 130
        versionName '1.3.0'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets { main { assets.srcDirs = ['src/main/assets'] } }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}

tasks.register('prepareWebAssets', Copy) {
    from(rootProject.file('../')) {
      include 'index.html', '*.js', '*.css', 'manifest.webmanifest', 'assets/**'
      exclude 'tests/**','patch_*.py', 'build.py'
    }
    into(layout.projectDirectory.dir('src/main/assets/www'))
}
tasks.named('preBuild') { dependsOn('prepareWebAssets') }